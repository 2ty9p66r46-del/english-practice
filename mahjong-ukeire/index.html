<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b19"><title>麻雀 有効牌チェッカー</title>
<style>
:root{color-scheme:dark;--bg:#101b19;--panel:#1b2925;--panel2:#23332e;--ink:#f5f2e8;--muted:#a9b7ad;--green:#8ee0b2;--line:#3c5148;--gold:#f5cf79}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20342c,var(--bg) 55%);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px 16px 48px}header{text-align:center;margin:8px 0 22px}h1{font-size:clamp(25px,6vw,36px);margin:0 0 7px;letter-spacing:.04em}header p{margin:0;color:var(--muted);font-size:14px}.panel{background:#1b2925ed;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 14px 36px #0003}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;color:var(--muted);margin:0 0 8px}.badge{border-radius:99px;background:#31473d;color:var(--green);font-size:12px;padding:4px 9px;font-weight:700}.tip{font-size:13px;color:var(--muted);line-height:1.55;margin:8px 0 0}.tiles{display:flex;flex-wrap:wrap;gap:7px}.tile{width:42px;height:52px;background:#f4f1e7;color:#183029;border:0;border-radius:7px 7px 10px 10px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #b5b2a7;cursor:pointer;position:relative}.tile small{font-size:10px;display:block;line-height:10px;margin-top:1px}.tile.suit-m{color:#bd3b32}.tile.suit-p{color:#23815d}.tile.suit-s{color:#344eaa}.tile.honor{color:#182822}.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #b5b2a7}.suit-label{font-size:11px;color:var(--muted);width:100%;margin:5px 0 -3px}.selector{display:flex;gap:8px;margin:0 0 12px}.select-btn,.clear-btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}.select-btn.active{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.clear-btn{color:#ffc2b5}.rack{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:58px;padding:9px;background:#101a17;border-radius:12px}.rack .tile{width:34px;height:43px;font-size:17px;cursor:pointer}.rack .tile small{font-size:8px}.empty{font-size:13px;color:#77877d}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--green);color:#14231d;border:0;border-radius:11px;padding:12px 18px;font-weight:850;font-size:15px}.result{display:none}.statline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:2px 0 14px}.stat{background:#101a17;border-radius:12px;padding:12px 15px;min-width:130px}.stat strong{display:block;font-size:25px;color:var(--gold);line-height:1.15}.stat span{font-size:12px;color:var(--muted)}.ukeire{display:flex;flex-wrap:wrap;gap:9px}.ukei{background:#f4f1e7;color:#1a2822;border-radius:10px;padding:7px 9px 6px;min-width:58px;text-align:center;box-shadow:0 3px 0 #b5b2a7}.ukei .tileface{font-size:21px;font-weight:850;line-height:1.1}.ukei .n{font-size:12px;font-weight:750;color:#365d49}.ukei.zero{opacity:.55}.empty-result{color:var(--muted);font-size:14px}.error{color:#ffaaa0;font-size:13px;margin-top:8px;min-height:18px}.footer{font-size:11px;color:#85948a;text-align:center;padding-top:12px}@media(max-width:450px){.panel{padding:15px}.tile{width:38px;height:48px}.tiles{gap:6px}}
</style>
</head>
<body><main class="wrap">
<header><h1>有効牌チェッカー</h1><p>手牌からシャンテン数と受け入れ牌を牌種ごとに表示</p></header>
<section class="panel"><div class="row"><h2>手牌 <span class="badge" id="handCount">0 / 13</span></h2><button class="clear-btn" id="clearAll">クリア</button></div><div class="selector"><button class="select-btn active" data-target="hand">＋ 手牌に追加</button><button class="select-btn" data-target="seen">＋ 見えている牌に追加</button></div><div class="rack" id="handRack"><span class="empty">下の牌をタップして手牌を入力</span></div><p class="tip">通常の13枚の手牌を入力してください。牌をタップすると選択中の欄に追加されます。欄の牌をタップすると1枚削除できます。</p><div class="error" id="error"></div></section>
<section class="panel"><div class="row"><h2>見えている牌（自分の手牌以外）</h2><span class="badge" id="seenCount">0 枚</span></div><div class="rack" id="seenRack"><span class="empty">河・副露・ドラ表示牌などを入力（任意）</span></div><p class="tip">残り枚数の計算に使います。入力した見えている牌と手牌を合わせて、各牌4枚を超えないようにしてください。</p></section>
<section class="panel"><h2>牌を選択</h2><div class="tiles" id="palette"></div></section>
<div class="actions"><button class="primary" id="analyze">有効牌を調べる</button></div>
<section class="panel result" id="result"><div class="row"><h2>分析結果</h2><span class="badge" id="shantenBadge"></span></div><div class="statline"><div class="stat"><strong id="ukeireTotal">—</strong><span>受け入れ総数（残り枚数）</span></div><div class="stat"><strong id="ukeireKinds">—</strong><span>有効牌の種類</span></div></div><h3>シャンテン数を下げる牌</h3><div class="ukeire" id="ukeire"></div><p class="tip" id="resultNote"></p></section>
<p class="footer">標準形・七対子・国士無双のシャンテン数に対応</p>
</main>
<script>
const labels=[...Array.from({length:9},(_,i)=>`${i+1}萬`),...Array.from({length:9},(_,i)=>`${i+1}筒`),...Array.from({length:9},(_,i)=>`${i+1}索`),'東','南','西','北','白','發','中'];
const faces=[...Array.from({length:9},(_,i)=>`${i+1}<small>萬</small>`),...Array.from({length:9},(_,i)=>`${i+1}<small>筒</small>`),...Array.from({length:9},(_,i)=>`${i+1}<small>索</small>`),'東','南','西','北','白','發','中'];
let hand=Array(34).fill(0),seen=Array(34).fill(0),target='hand';
const palette=document.querySelector('#palette');
for(let s=0;s<3;s++){const title=document.createElement('div');title.className='suit-label';title.textContent=['萬子','筒子','索子'][s];palette.append(title);for(let i=0;i<9;i++)palette.append(makeTile(s*9+i,'palette'))}
const title=document.createElement('div');title.className='suit-label';title.textContent='字牌';palette.append(title);for(let i=27;i<34;i++)palette.append(makeTile(i,'palette'));
function makeTile(i,where){const b=document.createElement('button');b.className='tile '+(i<9?'suit-m':i<18?'suit-p':i<27?'suit-s':'honor');b.innerHTML=faces[i];b.title=labels[i];if(where==='palette')b.onclick=()=>add(i);else b.onclick=()=>remove(where,i);return b}
function add(i){const own=hand[i]+seen[i];const err=document.querySelector('#error');if(own>=4){err.textContent=`${labels[i]}は4枚すべて入力済みです。`;return}err.textContent='';(target==='hand'?hand:seen)[i]++;render()}
function remove(which,i){(which==='hand'?hand:seen)[i]--;document.querySelector('#error').textContent='';render()}
function rack(elId,counts,which,emptyText){const el=document.getElementById(elId);el.innerHTML='';let n=0;counts.forEach((c,i)=>{for(let j=0;j<c;j++){el.append(makeTile(i,which));n++}});if(!n){const span=document.createElement('span');span.className='empty';span.textContent=emptyText;el.append(span)}}
function render(){rack('handRack',hand,'hand','下の牌をタップして手牌を入力');rack('seenRack',seen,'seen','河・副露・ドラ表示牌などを入力（任意）');document.querySelector('#handCount').textContent=`${hand.reduce((a,b)=>a+b,0)} / 13`;document.querySelector('#seenCount').textContent=`${seen.reduce((a,b)=>a+b,0)} 枚`}
document.querySelectorAll('.select-btn').forEach(b=>b.onclick=()=>{target=b.dataset.target;document.querySelectorAll('.select-btn').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelector('#clearAll').onclick=()=>{hand.fill(0);seen.fill(0);document.querySelector('#error').textContent='';document.querySelector('#result').style.display='none';render()};
function suitOptions(src,sequence){let a=src.slice(),out=new Set();function go(i,m,t,p){while(i<a.length&&a[i]===0)i++;if(i===a.length){out.add(`${m},${t},${p}`);return}a[i]--;go(i,m,t,p);a[i]++;
if(a[i]>=2){a[i]-=2;if(!p)go(i,m,t,1);go(i,m,t+1,p);a[i]+=2}
if(a[i]>=3){a[i]-=3;go(i,m+1,t,p);a[i]+=3}
if(sequence&&i<7&&a[i+1]>0&&a[i+2]>0){a[i]--;a[i+1]--;a[i+2]--;go(i,m+1,t,p);a[i]++;a[i+1]++;a[i+2]++}
if(sequence&&i<8&&a[i+1]>0){a[i]--;a[i+1]--;go(i,m,t+1,p);a[i]++;a[i+1]++}
if(sequence&&i<7&&a[i+2]>0){a[i]--;a[i+2]--;go(i,m,t+1,p);a[i]++;a[i+2]++}
}go(0,0,0,0);return [...out].map(x=>x.split(',').map(Number))}
function shanten(c){let opts=[suitOptions(c.slice(0,9),true),suitOptions(c.slice(9,18),true),suitOptions(c.slice(18,27),true),suitOptions(c.slice(27),false)];let combos=[[0,0,0]];for(const group of opts){const next=[];for(const x of combos)for(const y of group)next.push([x[0]+y[0],x[1]+y[1],x[2]+y[2]]);combos=next}let best=8;for(const [m0,t0,p] of combos){const m=Math.min(m0,4),t=Math.min(t0,4-m);best=Math.min(best,8-2*m-t-p)}
let pairs=0,unique=0,orphans=0,hasPair=false;for(let i=0;i<34;i++){if(c[i])unique++;if(c[i]>=2)pairs++}for(const i of [0,8,9,17,18,26,27,28,29,30,31,32,33]){if(c[i])orphans++;if(c[i]>=2)hasPair=true}best=Math.min(best,6-pairs+Math.max(0,7-unique),13-orphans-(hasPair?1:0));return best}
document.querySelector('#analyze').onclick=()=>{const n=hand.reduce((a,b)=>a+b,0),err=document.querySelector('#error');if(n!==13){err.textContent=`手牌は13枚入力してください（現在 ${n} 枚）。`;return}err.textContent='';for(let i=0;i<34;i++)if(hand[i]+seen[i]>4){err.textContent=`${labels[i]}の入力が4枚を超えています。`;return}const s=shanten(hand),eff=[];for(let i=0;i<34;i++){if(hand[i]>=4)continue;const c=hand.slice();c[i]++;if(shanten(c)<s)eff.push({i,left:4-hand[i]-seen[i]})}const total=eff.reduce((a,x)=>a+x.left,0);document.querySelector('#shantenBadge').textContent=s<0?'和了':s===0?'テンパイ':`${s}シャンテン`;document.querySelector('#ukeireTotal').textContent=`${total} 枚`;document.querySelector('#ukeireKinds').textContent=`${eff.length} 種`;const box=document.querySelector('#ukeire');box.innerHTML='';if(!eff.length){box.innerHTML='<span class="empty-result">シャンテン数を下げる有効牌はありません。</span>'}else for(const x of eff){const el=document.createElement('div');el.className='ukei'+(x.left===0?' zero':'');el.innerHTML=`<div class="tileface">${faces[x.i].replace(/<small>.*?<\/small>/,'')}</div><div class="n">残り ${x.left} 枚</div>`;el.title=labels[x.i];box.append(el)}document.querySelector('#resultNote').textContent='残り枚数は「4枚 − 手牌 − 入力した見えている牌」で計算します。0枚の有効牌も種類が分かるよう表示しています。';document.querySelector('#result').style.display='block';document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'nearest'})};
render();
</script></body></html>
