<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f6fb">
  <meta name="description" content="FloVo — 英語を声に変える練習アプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>FloVo</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:#111827;background:#f5f5fa;font-synthesis:none;--blue:#087cff;--ink:#111827;--muted:#6f7b8e;--soft:#edeef3;--card:#fff}
    *{box-sizing:border-box}
    html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;background:#f5f5fa}
    button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
    .shell{position:relative;display:flex;flex-direction:column;width:min(100%,520px);height:100dvh;margin:auto;background:#f5f5fa;overflow:hidden}
    .topbar{flex:0 0 auto;padding:calc(24px + env(safe-area-inset-top)) 24px 24px;background:#f7f7fb;border-bottom:1px solid #eef0f4}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand-lockup{display:flex;min-width:0;flex:1 1 auto;flex-direction:column;align-items:center;justify-content:center;gap:1px}
    .brand-logo{display:flex;align-items:center;width:138px;height:54px;transform:translateY(1px)}
    .brand-logo img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px #173c7a1f)}
    .brand-subtitle{margin-top:-5px;color:#53627b;font-family:"Avenir Next Condensed","Arial Narrow",-apple-system,sans-serif;font-size:.47rem;font-weight:800;letter-spacing:.15em;line-height:1;text-transform:uppercase;white-space:nowrap}
    .header-actions{display:flex;align-items:center;gap:5px}
    .header-action{display:flex;width:53px;height:50px;text-decoration:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #dce2ec;border-radius:14px;background:#fff;color:#526078;box-shadow:0 3px 10px #26354a0b;font-size:.62rem;font-weight:800}
    .header-action svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .header-action:active{transform:scale(.96)}
    .match-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;color:#7a8495;font-size:.75rem;font-weight:700}
    .match-counts{display:flex;min-width:104px;flex-direction:column;align-items:stretch;gap:2px}
    .match-metric{display:grid;grid-template-columns:52px 5ch;align-items:baseline;column-gap:5px;white-space:nowrap}
    .match-summary strong{display:flex;width:5ch;justify-content:flex-end;color:#344054;font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right}
    .count-padding{color:#c7ccd5}
    .count-value{color:#344054}
    .reload-button{display:flex;width:53px;height:48px;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:1px solid #e0e4eb;border-radius:12px;background:#fff;color:#647086;box-shadow:0 1px 3px #26354a0d;font-size:.56rem;font-weight:800}
    .reload-button:active{transform:scale(.94)}
    .reload-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .reload-button.loading svg{animation:reloadSpin .8s linear infinite}
    @keyframes reloadSpin{to{transform:rotate(360deg)}}
    .file-input{display:none}
    .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 34px;scrollbar-width:none}
    .scroll::-webkit-scrollbar{display:none}
    .stack{display:grid;gap:16px}
    .card{padding:22px;border-radius:23px;background:var(--card);box-shadow:0 1px 1px #1822350d,0 9px 25px #27344d0a}
    .quick{display:grid;gap:9px;padding:14px}
    .practice-options{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:7px}
    .practice-control{min-width:0;padding:7px 8px 8px;border:1px solid #e0e4eb;border-radius:13px;background:linear-gradient(#f7f8fa,#f0f2f5);box-shadow:inset 0 1px 0 #ffffffd9}
    .practice-control-title{display:block;margin:0 3px 5px;color:#7a8495;font-size:.64rem;font-weight:700}
    .order-switch{position:relative;display:grid;width:100%;height:34px;touch-action:manipulation;grid-template-columns:1fr 1fr;align-items:center;padding:2px;border:0;border-radius:10px;background:#e5e8ee;color:#727c8e;overflow:hidden}
    .order-thumb{position:absolute;inset:2px auto 2px 2px;width:calc(50% - 2px);border-radius:8px;background:linear-gradient(135deg,#087cff,#0a6be8);box-shadow:0 4px 10px #087cff30;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
    .order-switch.ordered .order-thumb{transform:translateX(100%)}
    .order-switch span{position:relative;z-index:1;font-size:.68rem;font-weight:800;transition:color .2s ease}
    .order-switch span:first-of-type,.order-switch.ordered span:last-of-type{color:#fff}
    .order-switch.ordered span:first-of-type{color:#727c8e}
    .question-picker{position:relative;padding-left:3px;padding-right:3px}
    .question-trigger{display:flex;width:100%;height:34px;align-items:center;justify-content:center;gap:3px;padding:0 4px;border:0;border-radius:10px;background:linear-gradient(135deg,#087cff,#0a6be8);color:#fff;box-shadow:0 4px 10px #087cff30;font-size:.72rem;font-weight:800}
    .question-chevron{color:#dcecff;font-size:.72rem;transform:translateY(-1px)}
    .question-menu{position:absolute;z-index:20;top:calc(100% + 6px);right:0;width:84px;max-height:266px;overflow-y:auto;padding:4px;border:1px solid #ffffff24;border-radius:14px;background:#50535af5;box-shadow:0 12px 30px #18223542;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .question-menu[hidden]{display:none}
    .question-menu::-webkit-scrollbar{display:none}
    .question-option{display:block;width:100%;height:38px;padding:0 3px;border:0;border-radius:9px;background:transparent;color:#fff;font-size:.92rem;font-weight:600;text-align:center}
    .question-option.selected{background:linear-gradient(135deg,#1686ff,#0a6be8);box-shadow:0 2px 7px #087cff40;font-weight:800}
    .question-option:active{background:#ffffff2e}
    .practice{width:100%;min-height:60px;border:0;border-radius:17px;background:linear-gradient(135deg,#087cff,#0a6be8);color:#fff;font-size:1.08rem;font-weight:800;letter-spacing:.02em;box-shadow:0 8px 18px #087cff2b;transition:background .2s ease,color .2s ease,box-shadow .2s ease,transform .14s ease}
    .practice:disabled{background:linear-gradient(145deg,#e3e6eb,#d8dde5);color:#9aa3b1;box-shadow:inset 0 1px 0 #ffffffc9;opacity:1}
    .practice:not(:disabled):active,.wide-button:active,.choice:active,.tab:active{transform:scale(.98)}
    h2{margin:0 0 20px;font-size:1.25rem;line-height:1.35;letter-spacing:-.025em}
    .wide-button{width:100%;min-height:62px;border:0;border-radius:18px;background:#f0f1f6;color:var(--blue);font-size:1.05rem;font-weight:800}
    .file-state{display:flex;gap:12px;align-items:center;margin-top:12px;padding:14px;border-radius:14px;background:#f7f8fa;color:var(--muted);font-size:.86rem}
    .file-state strong{color:#344054}
    .helper{margin:12px 2px 0;color:#6c7890;font-size:.86rem;line-height:1.65}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .section-head h2{margin:0}
    .filter-bulk-actions{display:flex;align-items:center;gap:6px}
    .bulk-filter-button{min-height:34px;padding:0 12px;border:1px solid #dfe3ea;border-radius:999px;background:linear-gradient(#f4f5f7,#e9ecf0);color:#6f7a8d;font-size:.69rem;font-weight:800;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 2px 5px #26354a10}
    .bulk-filter-button.selected{color:#fff;border-color:#087cff;background:linear-gradient(135deg,#087cff,#0a6be8);box-shadow:0 5px 12px #087cff30}
    .bulk-filter-button:active{transform:scale(.96)}
    .filter-section{position:relative;isolation:isolate;padding:15px 0 17px;border-top:1px solid #dde3eb}
    .filter-section:first-of-type{border-top:0}
    .filter-section::before{content:"";position:absolute;z-index:0;inset:0 -22px;background:#edf2f8;pointer-events:none}
    .filter-section:nth-of-type(odd)::before{background:#f8f9fc}
    .filter-section > *{position:relative;z-index:1}
    .filter-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .filter-section-head h3{display:flex;min-width:0;align-items:center;gap:7px;margin:0;color:#344054;font-size:.94rem;letter-spacing:.01em}
    .condition-badge{display:inline-flex;min-height:25px;align-items:center;padding:0 10px;border:1px solid #c8d5fb;border-radius:999px;background:linear-gradient(145deg,#fff 0%,#eef5ff 52%,#f2edff 100%);color:#5268c9;font-size:.65rem;font-weight:850;letter-spacing:.02em;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 2px 6px #5268c914}
    .filter-section-actions{display:flex;align-items:center;gap:5px}
    .section-filter-button{min-height:28px;padding:0 9px;border:1px solid #dfe3ea;border-radius:999px;background:linear-gradient(#f4f5f7,#e9ecf0);color:#6f7a8d;font-size:.61rem;font-weight:800;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 1px 2px #26354a0b}
    .section-filter-button.selected{color:#fff;border-color:#087cff;background:linear-gradient(135deg,#087cff,#0a6be8);box-shadow:0 4px 10px #087cff2e}
    .overall-filter-warning{min-height:1.35em;margin:0 2px 10px;color:#c93645;font-size:.67rem;font-weight:750;line-height:1.35}
    .overall-filter-warning[hidden]{display:block;visibility:hidden}
    .filter-warning{min-height:1.35em;margin:2px 2px 9px;color:#c93645;font-size:.64rem;font-weight:750;line-height:1.35}
    .filter-warning[hidden]{display:block;visibility:hidden}
    .section-filter-button:active{transform:scale(.96)}
    .label{margin:20px 0 11px;color:#475569;font-size:.91rem;font-weight:800}
    .level-grid,.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .choice{min-height:41px;padding:0 8px;border:1px solid #e0e3e9;border-radius:11px;background:linear-gradient(#f0f2f5,#eaedf1);color:#737c8d;font-weight:750;box-shadow:inset 0 1px 0 #ffffffbf,0 1px 2px #1822370a;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease}
    .part-label{margin-bottom:7px}
    .part-group .choice{display:flex;min-height:49px;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05}
    .part-group .choice-main{font-size:.91rem;font-weight:800}
    .part-group .choice small{color:currentColor;font-size:.54rem;font-weight:650;letter-spacing:.01em;opacity:.72}
    .choice.selected{color:var(--tone);border-color:var(--line);background:linear-gradient(145deg,var(--wash-top),var(--wash-bottom));box-shadow:inset 0 1px 0 #ffffffe8,0 3px 9px var(--shadow)}
    .all.selected{color:var(--tone);border-color:var(--line);background:linear-gradient(145deg,var(--wash-top),var(--wash-bottom));box-shadow:inset 0 1px 0 #ffffffe8,0 2px 7px var(--shadow)}
    .level{border-width:1px}
    .red{--tone:#a92b39;--line:#d9969f;--wash-top:#fff5f6;--wash-bottom:#fbe4e7;--shadow:#a92b391f}
    .orange{--tone:#7f5a08;--line:#d2b65e;--wash-top:#fffbed;--wash-bottom:#f7edc9;--shadow:#7f5a081c}
    .yellow{--tone:#176c47;--line:#7db99b;--wash-top:#f3fbf7;--wash-bottom:#dcf1e6;--shadow:#176c471c}
    .blue{--tone:#0876ee;--line:#8fc1f5;--wash-top:#f4f9ff;--wash-bottom:#e2f0ff;--shadow:#0876ee1c}
    .all.blue.selected{color:#fff;border-color:#087cff;background:linear-gradient(135deg,#087cff,#0a6be8);box-shadow:0 4px 10px #087cff2e}
    .green{--tone:#0876ee;--line:#8fc1f5;--wash-top:#f4f9ff;--wash-bottom:#e2f0ff;--shadow:#0876ee1c}
    .purple{--tone:#60399f;--line:#ad93d4;--wash-top:#faf7ff;--wash-bottom:#ebe3f8;--shadow:#60399f1f}
    .group{margin-top:13px}
    .filter-section .group + .group{margin-top:16px;padding-top:13px;border-top:1px solid #eef1f5}
    .group-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:#526078;font-size:.86rem;font-weight:800}
    .all{min-height:24px;padding:0 7px;border:1px solid #e0e3e9;border-radius:999px;background:linear-gradient(#f0f2f5,#eaedf1);color:#737c8d;font-size:.67rem;font-weight:800;line-height:1;box-shadow:inset 0 1px 0 #ffffffbf}
    .understanding{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .understanding .choice{min-height:47px;font-size:.82rem}
    .segmented{display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid #e3e6ec;border-radius:16px;background:#f0f1f4}
    .segment{min-height:49px;border:0;border-radius:12px;background:transparent;color:#748095;font-weight:800}
    .segment.active{background:#fff;color:var(--blue);box-shadow:0 3px 10px #20304718}
    .bottom-space{height:4px}
    .nav{flex:0 0 auto;display:flex;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #e1e4e9;box-shadow:0 -8px 25px #26354a08;overflow:hidden}
    .nav-home{position:relative;z-index:2;flex:0 0 88px;background:#fff;box-shadow:8px 0 18px #26354a0d}
    .nav-scroll{display:flex;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .nav-scroll::-webkit-scrollbar{display:none}
    .tab{display:flex;flex:0 0 78px;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:#fff;color:#92959c;font-size:.7rem;font-weight:700;white-space:nowrap}
    .tab.active{color:var(--blue)}
    .tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    @media (min-width:700px){body{background:#e7e8ee}.shell{box-shadow:0 0 50px #26354a20}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="toprow">
        <div class="brand-lockup"><div class="brand-logo"><img src="./flovo-wordmark-v3.png" alt="FloVo"></div><div class="brand-subtitle">English Composition Practice</div></div>
        <div class="header-actions" aria-label="Excelメニュー">
          <button class="header-action" id="importButton" type="button" aria-label="Excelを読み込む"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg><span>読込</span></button>
          <button class="header-action" id="exportButton" type="button" aria-label="Excelを書き出す"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 19h14"/></svg><span>書出</span></button>
          <button class="header-action" id="templateButton" type="button" aria-label="Excel雛形をダウンロード"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg><span>雛形</span></button>
        </div>
        <input class="file-input" id="excelInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </div>
      <div class="match-summary" aria-live="polite"><button class="reload-button" id="reloadButton" type="button" aria-label="アプリを最新版に更新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.35 5.65"/><path d="M20 4v7h-7"/></svg><span>リロード</span></button><div class="match-counts"><span class="match-metric"><span>該当単語</span><strong id="wordCount">0</strong></span><span class="match-metric"><span>該当例文</span><strong id="exampleCount">0</strong></span></div></div>
    </header>
    <main class="scroll" id="mainScroll">
      <div class="stack">
        <section class="card quick"><button class="practice" id="practiceButton" type="button" data-coming>練習する</button><div class="practice-options"><div class="practice-control"><span class="practice-control-title">出題順</span><button class="order-switch" id="orderSwitch" type="button" aria-pressed="false"><i class="order-thumb"></i><span>シャッフル</span><span>順番通り</span></button></div><div class="practice-control question-picker" id="questionPicker"><span class="practice-control-title">出題数</span><button class="question-trigger" id="questionLimit" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="questionLimitValue">すべて</span><span class="question-chevron">⌄</span></button><div class="question-menu" id="questionMenu" role="listbox" aria-label="出題数" hidden></div></div></div></section>
        <section class="card">
          <div class="section-head"><h2>絞り込み条件</h2><div class="filter-bulk-actions"><button class="bulk-filter-button select" id="selectAllFilters" type="button">すべて選択</button></div></div><p class="overall-filter-warning" id="overallFilterWarning" hidden></p>
          <div class="filter-section" data-filter-section="word">
            <div class="filter-section-head"><h3><span class="condition-badge">条件1</span><span>単語レベル</span></h3><div class="filter-section-actions"><button class="section-filter-button select" type="button" data-section-action="select">すべて選択</button></div></div><p class="filter-warning" hidden>少なくともひとつ項目を選択してください。</p>
          <div class="group level-group">
            <div class="group-title"><span>Speaking</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice level red">S1</button><button class="choice level orange">S2</button><button class="choice level yellow">S3</button></div>
          </div>
          <div class="group level-group">
            <div class="group-title"><span>Writing</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice level red">W1</button><button class="choice level orange">W2</button><button class="choice level yellow">W3</button></div>
          </div>
          </div>
          <div class="filter-section" data-filter-section="part">
            <div class="filter-section-head"><h3><span class="condition-badge">条件2</span><span>品詞レベル</span></h3><div class="filter-section-actions"><button class="section-filter-button select" type="button" data-section-action="select">すべて選択</button></div></div><p class="filter-warning" hidden>少なくともひとつ項目を選択してください。</p>
          <div class="group part-group">
            <div class="group-title"><span>RANK S</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice" data-value="動詞"><span class="choice-main">動詞</span><small>verb</small></button><button class="choice" data-value="名詞"><span class="choice-main">名詞</span><small>noun</small></button><button class="choice" data-value="形容詞"><span class="choice-main">形容詞</span><small>adjective</small></button></div>
          </div>
          <div class="group part-group">
            <div class="group-title"><span>RANK A</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice" data-value="前置詞"><span class="choice-main">前置詞</span><small>preposition</small></button><button class="choice" data-value="副詞"><span class="choice-main">副詞</span><small>adverb</small></button><button class="choice" data-value="接続詞"><span class="choice-main">接続詞</span><small>conjunction</small></button><button class="choice" data-value="法助動詞"><span class="choice-main">法助動詞</span><small>modal verb</small></button></div>
          </div>
          <div class="group part-group">
            <div class="group-title"><span>RANK B</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice" data-value="限定詞"><span class="choice-main">限定詞</span><small>determiner</small></button><button class="choice" data-value="代名詞"><span class="choice-main">代名詞</span><small>pronoun</small></button><button class="choice" data-value="助動詞"><span class="choice-main">助動詞</span><small>auxiliary verb</small></button></div>
          </div>
          <div class="group part-group">
            <div class="group-title"><span>RANK C</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice" data-value="前限定詞"><span class="choice-main">前限定詞</span><small>predeterminer</small></button><button class="choice" data-value="間投詞"><span class="choice-main">間投詞</span><small>interjection</small></button><button class="choice" data-value="数詞"><span class="choice-main">数詞</span><small>numeral</small></button></div>
          </div>
          <div class="group part-group">
            <div class="group-title"><span>RANK D</span><button class="all blue" type="button">ALL</button></div>
            <div class="choice-grid"><button class="choice" data-value="不定冠詞"><span class="choice-main">不定冠詞</span><small>indefinite article</small></button><button class="choice" data-value="定冠詞"><span class="choice-main">定冠詞</span><small>definite article</small></button></div>
          </div>
          </div>
          <div class="filter-section" data-filter-section="other">
            <div class="filter-section-head"><h3><span class="condition-badge">条件3</span><span>その他</span></h3><div class="filter-section-actions"><button class="section-filter-button select" type="button" data-section-action="select">すべて選択</button></div></div><p class="filter-warning" hidden>少なくともひとつ項目を選択してください。</p>
          <div class="group understanding-group">
            <div class="group-title"><span>理解度</span><button class="all blue" type="button">ALL</button></div>
            <div class="understanding">
            <button class="choice level red">0%</button><button class="choice level orange">50%</button><button class="choice level yellow">80%</button><button class="choice level green">100%</button><button class="choice level purple">未登録</button>
            </div>
          </div>
          </div>
        </section>
        <div class="bottom-space"></div>
      </div>
    </main>
    <nav class="nav" aria-label="メインメニュー">
      <button class="tab nav-home active" type="button"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
      <div class="nav-scroll">
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>練習</span></button>
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>リスト</span></button>
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10z"/><path d="m13.5 7 3.5 3.5M4 20l1-4.5"/></svg><span>編集</span></button>
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>追加</span></button>
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.38.32.73.6 1 .3.28.69.42 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.7.6z"/></svg><span>設定</span></button>
        <button class="tab" type="button" data-coming><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 3.8 1.95c-.95.68-1.5 1.08-1.5 2.05M12 17h.01"/></svg><span>ヘルプ</span></button>
      </div>

  </div>
  <script>
    const EXPECTED_HEADERS=['品詞重要度','No','Sub No','単語','発音記号US','発音記号UK','品詞','意味','日本語文','英文','備考','S','W','理解度','データチェック'];
    const importButton=document.getElementById('importButton');
    const exportButton=document.getElementById('exportButton');
    const reloadButton=document.getElementById('reloadButton');
    const templateButton=document.getElementById('templateButton');
    const excelInput=document.getElementById('excelInput');
    const text=value=>String(value??'').trim();
    const openDatabase=()=>new Promise((resolve,reject)=>{
      const request=indexedDB.open('flovo-data',1);
      request.onupgradeneeded=()=>request.result.createObjectStore('app');
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
    const saveImportedData=async payload=>{
      const database=await openDatabase();
      await new Promise((resolve,reject)=>{
        const transaction=database.transaction('app','readwrite');
        transaction.objectStore('app').put(payload,'importedExcel');
        transaction.oncomplete=resolve;
        transaction.onerror=()=>reject(transaction.error);
      });
      database.close();
    };
    const loadImportedData=async()=>{
      const database=await openDatabase();
      const result=await new Promise((resolve,reject)=>{
        const request=database.transaction('app','readonly').objectStore('app').get('importedExcel');
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
      database.close();
      return result;
    };
    const saveFileToDevice=async file=>{
      if(navigator.canShare?.({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
      const url=URL.createObjectURL(file);
      const link=document.createElement('a');
      link.href=url;
      link.download=file.name;
      link.style.display='none';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000);
    };
    const validateRows=rows=>{
      const errors=[];
      const pairNumbers=new Map();
      rows.forEach((row,index)=>{
        const rowNo=index+2;
        const required=[0,1,2,3,4,5,6];
        if(required.some(column=>!text(row[column])))errors.push(`${rowNo}行目：必須項目が空欄です`);
        if(!text(row[11])&&!text(row[12]))errors.push(`${rowNo}行目：S・Wが両方空欄です`);
        if(text(row[14]))errors.push(`${rowNo}行目：データチェックに「${text(row[14])}」があります`);
        const word=text(row[3]).toLowerCase();
        const part=text(row[6]);
        const no=text(row[1]);
        if(word&&part&&no){
          const key=`${word}\\t${part}`;
          if(pairNumbers.has(key)&&pairNumbers.get(key)!==no)errors.push(`${rowNo}行目：同じ単語・品詞が別Noで定義されています`);
          else pairNumbers.set(key,no);
        }
      });
      return [...new Set(errors)];
    };
    reloadButton.addEventListener('click',async()=>{
      if(!navigator.onLine){alert('オフラインのため更新できません。通信を確認してください。');return}
      reloadButton.disabled=true;
      reloadButton.classList.add('loading');
      try{
        const registration=await navigator.serviceWorker?.getRegistration();
        await registration?.update();
        const cacheNames=await caches.keys();
        await Promise.all(cacheNames.filter(name=>name.startsWith('flovo-')).map(name=>caches.delete(name)));
        location.reload();
      }catch(error){
        reloadButton.disabled=false;
        reloadButton.classList.remove('loading');
        alert('更新に失敗しました。通信を確認してもう一度お試しください。');
      }
    });
    templateButton.addEventListener('click',async()=>{
      if(!confirm('Excelの雛形をダウンロードしますか？'))return;
      templateButton.disabled=true;
      try{
        const response=await fetch('./Import-data_format.xlsx',{cache:'no-store'});
        if(!response.ok)throw new Error('雛形ファイルを取得できませんでした。');
        const file=new File([await response.blob()],'Import-data_format.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        await saveFileToDevice(file);
      }catch(error){
        if(error?.name!=='AbortError')alert(error?.message||'雛形の保存に失敗しました。');
      }finally{
        templateButton.disabled=false;
      }
    });
    exportButton.addEventListener('click',async()=>{
      exportButton.disabled=true;
      try{
        const stored=await loadImportedData();
        if(!stored)throw new Error('書き出すデータがありません。先にExcelを読み込んでください。');
        let bytes=stored.fileBytes;
        if(!bytes||stored.modified){
          if(typeof XLSX==='undefined')throw new Error('Excel書出機能を準備できませんでした。通信状態を確認してください。');
          const sheet=XLSX.utils.aoa_to_sheet([stored.headers,...stored.rows]);
          const workbook=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook,sheet,'単語リスト');
          bytes=XLSX.write(workbook,{bookType:'xlsx',type:'array'});
        }
        const now=new Date();
        const pad=value=>String(value).padStart(2,'0');
        const timestamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
        const originalName=stored.fileName||'FloVo_export.xlsx';
        const baseName=originalName.replace(/\.xlsx$/i,'');
        const fileName=`${baseName}_${timestamp}.xlsx`;
        const file=new File([bytes],fileName,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        await saveFileToDevice(file);
      }catch(error){
        if(error?.name!=='AbortError')alert(error?.message||'Excelの書き出しに失敗しました。');
      }finally{
        exportButton.disabled=false;
      }
    });
    importButton.addEventListener('click',()=>{
      if(typeof XLSX==='undefined'){alert('Excel読込機能を準備できませんでした。通信状態を確認して、アプリを開き直してください。');return}
      excelInput.click();
    });
    excelInput.addEventListener('change',async()=>{
      const file=excelInput.files?.[0];
      if(!file)return;
      importButton.disabled=true;
      try{
        const fileBytes=await file.arrayBuffer();
        const workbook=XLSX.read(fileBytes,{type:'array',cellFormula:true});
        const sheet=workbook.Sheets['単語リスト']||workbook.Sheets[workbook.SheetNames[0]];
        if(!sheet)throw new Error('読み込めるシートがありません。');
        const allRows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
        const headers=(allRows[0]||[]).map(text);
        const formatMatches=headers.length===EXPECTED_HEADERS.length&&EXPECTED_HEADERS.every((header,index)=>headers[index]===header);
        if(!formatMatches)throw new Error('雛形と列名または列順が違います。雛形ファイルにデータを入力して読み込んでください。');
        const rows=allRows.slice(1).filter(row=>row.some(value=>text(value)));
        if(!rows.length)throw new Error('読み込めるデータがありません。');
        const errors=validateRows(rows);
        if(errors.length)throw new Error(`データにエラーがあります。\\n\\n${errors.slice(0,5).join('\\n')}${errors.length>5?`\\nほか${errors.length-5}件`:''}`);
        await saveImportedData({headers,rows,fileName:file.name,fileBytes,modified:false,importedAt:new Date().toISOString()});
        await refreshQuestionCount();
        alert(`${rows.length}行のデータを読み込みました。`);
      }catch(error){
        alert(error?.message||'Excelの読み込みに失敗しました。');
      }finally{
        importButton.disabled=false;
        excelInput.value='';
      }
    });
    const scroller=document.getElementById('mainScroll');
    const practiceButton=document.getElementById('practiceButton');
    const wordCount=document.getElementById('wordCount');
    const exampleCount=document.getElementById('exampleCount');
    const levelChoices=[...document.querySelectorAll('.level-group .choice')];
    const partChoices=[...document.querySelectorAll('.part-group .choice')];
    const understandingChoices=[...document.querySelectorAll('.understanding .choice')];
    const allFilterChoices=[...levelChoices,...partChoices,...understandingChoices];
    const selectAllFilters=document.getElementById('selectAllFilters');
    const overallFilterWarning=document.getElementById('overallFilterWarning');
    levelChoices.forEach(button=>button.classList.add(button.textContent.trim().endsWith('1')?'red':button.textContent.trim().endsWith('2')?'orange':'yellow'));
    document.querySelectorAll('.part-group').forEach(group=>{
      const rank=group.querySelector('.group-title span')?.textContent.trim().slice(-1);
      const tone={S:'red',A:'orange',B:'yellow',C:'green',D:'purple'}[rank];
      if(tone)group.querySelectorAll('.choice').forEach(button=>button.classList.add(tone));
    });
    const understandingTones={'未登録':'purple','0%':'red','50%':'orange','80%':'yellow','100%':'green'};
    understandingChoices.forEach(button=>button.classList.add(understandingTones[button.textContent.trim()]));
    const selectedValues=buttons=>new Set(buttons.filter(button=>button.classList.contains('selected')).map(button=>button.dataset.value||button.textContent.trim()));
    const refreshQuestionCount=async()=>{
      const stored=await loadImportedData();
      const rows=stored?.rows||[];
      const levels=selectedValues(levelChoices);
      const parts=selectedValues(partChoices);
      const understandings=selectedValues(understandingChoices);
      const matchingRows=rows.filter(row=>{
        if(!text(row[8])||!text(row[9]))return false;
        if(!levels.size||![text(row[11]),text(row[12])].some(value=>levels.has(value)))return false;
        if(!parts.size||!parts.has(text(row[6])))return false;
        const understanding=text(row[13])||'未登録';
        if(!understandings.size||!understandings.has(understanding))return false;
        return true;
      });
      const pairCount=new Set(matchingRows.map(row=>`${text(row[3]).toLowerCase()}\\t${text(row[6])}`)).size;
      practiceButton.dataset.questionCount=String(matchingRows.length);
      practiceButton.dataset.pairCount=String(pairCount);
      const renderFiveDigitCount=(element,value)=>{
        const number=Math.min(99999,Math.max(0,Math.trunc(Number(value)||0)));
        const digits=String(number);
        const padding='0'.repeat(5-digits.length);
        element.innerHTML=`<span class="count-padding">${padding}</span><span class="count-value">${digits}</span>`;
      };
      renderFiveDigitCount(wordCount,pairCount);
      renderFiveDigitCount(exampleCount,matchingRows.length);
    };
    const syncSubgroupAll=group=>{
      if(!group)return;
      const choices=[...group.querySelectorAll('.choice')];
      group.querySelector('.all')?.classList.toggle('selected',choices.length>0&&choices.every(choice=>choice.classList.contains('selected')));
    };
    const syncGlobalControls=()=>{
      const selectedCount=allFilterChoices.filter(choice=>choice.classList.contains('selected')).length;
      selectAllFilters.classList.toggle('selected',selectedCount===allFilterChoices.length);
      const emptyConditions=[...document.querySelectorAll('.filter-section')].map((section,index)=>section.querySelector('.choice.selected')?null:index+1).filter(Boolean);
      const hasEmptyConditions=emptyConditions.length>0;
      overallFilterWarning.textContent=hasEmptyConditions?`条件${emptyConditions.join(',')}の項目がひとつも選択されていません`:'';
      overallFilterWarning.hidden=!hasEmptyConditions;
      practiceButton.disabled=hasEmptyConditions;
      practiceButton.setAttribute('aria-disabled',String(hasEmptyConditions));
    };
    const syncSectionControls=section=>{
      if(!section)return;
      const choices=[...section.querySelectorAll('.choice')];
      const selectedCount=choices.filter(choice=>choice.classList.contains('selected')).length;
      section.querySelector('[data-section-action="select"]')?.classList.toggle('selected',choices.length>0&&selectedCount===choices.length);
      const warning=section.querySelector('.filter-warning');
      if(warning)warning.hidden=selectedCount>0;
      syncGlobalControls();
    };
    [...levelChoices,...partChoices,...understandingChoices].forEach(button=>button.addEventListener('click',()=>{
      button.classList.toggle('selected');
      syncSubgroupAll(button.closest('.group'));
      syncSectionControls(button.closest('.filter-section'));
      refreshQuestionCount();
    }));
    document.querySelectorAll('.group .all').forEach(button=>button.addEventListener('click',()=>{
      const group=button.closest('.group');
      const select=!button.classList.contains('selected');
      group.querySelectorAll('.choice').forEach(choice=>choice.classList.toggle('selected',select));
      button.classList.toggle('selected',select);
      syncSectionControls(group.closest('.filter-section'));
      refreshQuestionCount();
    }));
    const filterSections=[...document.querySelectorAll('.filter-section')];
    const setSectionFilters=(section,selected)=>{
      section.querySelectorAll('.choice').forEach(choice=>choice.classList.toggle('selected',selected));
      section.querySelectorAll('.group .all').forEach(button=>button.classList.toggle('selected',selected));
      syncSectionControls(section);
      refreshQuestionCount();
    };
    const setAllFilters=selected=>{
      allFilterChoices.forEach(choice=>choice.classList.toggle('selected',selected));
      document.querySelectorAll('.group .all').forEach(button=>button.classList.toggle('selected',selected));
      filterSections.forEach(syncSectionControls);
      syncGlobalControls();
      refreshQuestionCount();
    };
    filterSections.forEach(section=>{
      const button=section.querySelector('[data-section-action="select"]');
      button.addEventListener('click',()=>setSectionFilters(section,!button.classList.contains('selected')));
    });
    selectAllFilters.addEventListener('click',()=>setAllFilters(!selectAllFilters.classList.contains('selected')));
    setAllFilters(true);
    document.querySelectorAll('[data-coming]').forEach(button=>button.addEventListener('click',()=>alert('この機能は次の段階で追加します。')));
    const orderSwitch=document.getElementById('orderSwitch');
    const questionLimit=document.getElementById('questionLimit');
    const questionPicker=document.getElementById('questionPicker');
    const questionMenu=document.getElementById('questionMenu');
    const questionLimitValue=document.getElementById('questionLimitValue');
    const orderThumb=orderSwitch.querySelector('.order-thumb');
    const setOrder=ordered=>{
      orderThumb.style.transform='';
      orderSwitch.classList.toggle('ordered',ordered);
      orderSwitch.setAttribute('aria-pressed',String(ordered));
      practiceButton.dataset.order=ordered?'ordered':'shuffle';
    };
    orderSwitch.addEventListener('click',()=>{
      setOrder(!orderSwitch.classList.contains('ordered'));
    });
    const questionValues=['all',...Array.from({length:20},(_,index)=>String((index+1)*5))];
    const questionLabels=value=>value==='all'?'すべて':value;
    let selectedQuestionLimit='all';
    questionValues.forEach(value=>{
      const option=document.createElement('button');
      option.type='button';
      option.className='question-option'+(value==='all'?' selected':'');
      option.setAttribute('role','option');
      option.setAttribute('aria-selected',String(value==='all'));
      option.dataset.value=value;
      option.textContent=questionLabels(value);
      option.addEventListener('click',()=>{
        selectedQuestionLimit=value;
        questionLimitValue.textContent=questionLabels(value);
        practiceButton.dataset.questionLimit=value;
        questionMenu.querySelectorAll('.question-option').forEach(item=>{
          const selected=item.dataset.value===value;
          item.classList.toggle('selected',selected);
          item.setAttribute('aria-selected',String(selected));
        });
        questionMenu.hidden=true;
        questionLimit.setAttribute('aria-expanded','false');
      });
      questionMenu.appendChild(option);
    });
    questionLimit.addEventListener('click',()=>{
      const opening=questionMenu.hidden;
      questionMenu.hidden=!opening;
      questionLimit.setAttribute('aria-expanded',String(opening));
    });
    document.addEventListener('pointerdown',event=>{
      if(!questionPicker.contains(event.target)){
        questionMenu.hidden=true;
        questionLimit.setAttribute('aria-expanded','false');
      }
    });
    practiceButton.dataset.order='shuffle';
    practiceButton.dataset.questionLimit=selectedQuestionLimit;
    if('serviceWorker' in navigator){
      let reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(reloading)return;
        reloading=true;
        location.reload();
      });
      window.addEventListener('load',async()=>{
        const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
        registration.update();
      });
    }
  </script>
